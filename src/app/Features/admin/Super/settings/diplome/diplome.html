 <div class="section-toolbar">
    <div class="section-toolbar-left">
      <div class="section-icon" style="background:var(--accent-light);color:var(--accent);"><i class="fas fa-graduation-cap"></i></div>
      <div class="section-search">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Rechercher un diplôme..." class="settings-search-input" data-panel="diplome" />
      </div>
    </div>
    <button class="btn btn-primary btn-sm" onclick="openModal('modal-add-diplome')" >
      <i class="fas fa-plus"></i> Ajouter un diplôme
    </button>
  </div>
  <div class="config-table-wrap">
    <table class="config-table" id="table-diplome">
      <thead>
        <tr>
          <th style="width:80px;">ID</th>
          <th>Intitulé</th>
          <th style="width:130px;">Actions</th>
        </tr>
      </thead>
      <tbody>
       @for (d of listDiplome(); track $index) {
         <tr>
          <td><span class="config-id">#DIP-{{$index+1}}</span></td>
          <td><span class="config-intitule">{{d.intitule}}</span></td>
          <td><div class="config-actions"><button class="btn btn-ghost btn-sm btn-icon" data-edit-row><i class="fas fa-pen"></i></button><button class="btn btn-danger btn-sm btn-icon" data-confirm-delete="Supprimer ce diplôme ?"><i class="fas fa-trash"></i></button></div></td>
        </tr>
       
       }
      </tbody>
    </table>
  </div>


        <!-- MODAL ADD DIPLÔME -->
<div class="modal-overlay" id="modal-add-diplome">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title"><i class="fas fa-graduation-cap" style="color:var(--accent);margin-right:8px;"></i>Nouveau diplôme</span>
      <button class="modal-close" onclick="closeModal('modal-add-diplome')"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <form class="admin-form" [formGroup]="diplomeFB" id="form-diplome">
        <div class="form-group">
          <label class="form-label">Intitulé <span style="color:var(--red);">*</span></label>
          <input type="text" class="form-input" formControlName="intitule" placeholder="Ex : Baccalauréat, Licence…" required />
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-add-diplome')">Annuler</button>
      <button class="btn btn-primary" (click)="createDiplome()">
        <i class="fas fa-save"></i> Enregistrer
      </button>
    </div>
  </div>
</div>
