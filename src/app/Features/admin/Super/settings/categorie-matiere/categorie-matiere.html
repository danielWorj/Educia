 <div class="section-toolbar">
    <div class="section-toolbar-left">
      <div class="section-icon" style="background:var(--green-light);color:#15803D;"><i class="fas fa-tags"></i></div>
      <div class="section-search">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Rechercher une catégorie..." class="settings-search-input" data-panel="categorie" />
      </div>
    </div>
    <button class="btn btn-primary btn-sm" onclick="openModal('modal-add-categorie')">
      <i class="fas fa-plus"></i> Ajouter une catégorie
    </button>
  </div>
  <div class="config-table-wrap">
    <table class="config-table" id="table-categorie">
      <thead>
        <tr>
          <th style="width:80px;">ID</th>
          <th>Intitulé</th>
          <th>Section</th>
          <th style="width:130px;">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (c of listCategorieMatiere(); track $index) {
          <tr>
            <td><span class="config-id">#CAT-{{$index+1}}</span></td>
            <td><span class="config-intitule">{{c.intitule}}</span></td>
            <td><span class="config-desc">{{c.section.intitule}}</span></td>
            <td><div class="config-actions"><button class="btn btn-ghost btn-sm btn-icon" data-edit-row><i class="fas fa-pen"></i></button><button class="btn btn-danger btn-sm btn-icon" data-confirm-delete="Supprimer cette catégorie ?"><i class="fas fa-trash"></i></button></div></td>
          </tr>
        }
        
      </tbody>
    </table>
  </div>



        <!-- MODAL ADD CATÉGORIE -->
<div class="modal-overlay" id="modal-add-categorie">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title"><i class="fas fa-tags" style="color:#15803D;margin-right:8px;"></i>Nouvelle catégorie de matière</span>
      <button class="modal-close" onclick="closeModal('modal-add-categorie')"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <form class="admin-form" [formGroup]="categorieMatiereFb" id="form-categorie">
        <div class="form-group">
          <label class="form-label">Intitulé <span style="color:var(--red);">*</span></label>
          <input type="text" class="form-input" formControlName="intitule" placeholder="Ex : Sciences exactes, Langues…" required />
        </div>
        <div class="form-group">
          <label class="form-label">Section</label>
          <select class="form-select" formControlName="section">
            <option value="">--Choisir la section--</option>
            @for (s of listSection(); track $index) {
              <option value="{{s.id}}">{{s.intitule}}</option>
            }
          </select>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-add-categorie')">Annuler</button>
      <button class="btn btn-primary" (click)="createCategorieMatiere()">
        <i class="fas fa-save"></i> Enregistrer
      </button>
    </div>
  </div>
</div>
