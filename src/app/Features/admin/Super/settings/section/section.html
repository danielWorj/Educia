<div class="section-toolbar">
    <div class="section-toolbar-left">
      <div class="section-icon" style="background:#F3E8FF;color:#7C3AED;"><i class="fas fa-object-group"></i></div>
      <div class="section-search">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Rechercher une section..." class="settings-search-input" data-panel="section" />
      </div>
    </div>
    <button class="btn btn-primary btn-sm" onclick="openModal('modal-add-section')">
      <i class="fas fa-plus"></i> Ajouter une section
    </button>
  </div>
  <div class="config-table-wrap">
    <table class="config-table" id="table-section">
      <thead>
        <tr>
          <th style="width:80px;">ID</th>
          <th>Intitulé</th>
          <th>Description</th>
          <th style="width:130px;">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (s of listSection(); track $index) {
          <tr>
            <td><span class="config-id">#SEC-{{$index+1}}</span></td>
            <td><span class="config-intitule">{{s.intitule}}</span></td>
            <td><div class="config-actions"><button class="btn btn-ghost btn-sm btn-icon" data-edit-row><i class="fas fa-pen"></i></button><button class="btn btn-danger btn-sm btn-icon" data-confirm-delete="Supprimer cette section ?"><i class="fas fa-trash"></i></button></div></td>
          </tr>
        }
       

      </tbody>
    </table>
  </div>


  <!-- MODAL ADD SECTION -->
<div class="modal-overlay" id="modal-add-section">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title"><i class="fas fa-object-group" style="color:#7C3AED;margin-right:8px;"></i>Nouvelle section</span>
      <button class="modal-close" onclick="closeModal('modal-add-section')"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <form class="admin-form" [formGroup]="sectionFb" id="form-section">
        <div class="form-group">
          <label class="form-label">Intitulé <span style="color:var(--red);">*</span></label>
          <input type="text" class="form-input" formControlName="intitule" placeholder="Ex : Francophone, Anglophone…" required />
        </div>
        
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-add-section')">Annuler</button>
      <button class="btn btn-primary" (click)="createSection()">
        <i class="fas fa-save"></i> Enregistrer
      </button>
    </div>
  </div>
</div>
