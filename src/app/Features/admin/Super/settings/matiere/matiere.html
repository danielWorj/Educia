 <div class="section-toolbar">
    <div class="section-toolbar-left">
      <div class="section-icon" style="background:var(--primary-light);color:var(--primary);"><i class="fas fa-book"></i></div>
      <div class="section-search">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Rechercher une matière..." class="settings-search-input" data-panel="matiere" />
      </div>
    </div>
    <button class="btn btn-primary btn-sm" onclick="openModal('modal-add-matiere')">
      <i class="fas fa-plus"></i> Ajouter une matière
    </button>
  </div>
  <div class="config-table-wrap">
    <table class="config-table" id="table-matiere">
      <thead>
        <tr>
          <th style="width:80px;">ID</th>
          <th>Intitulé</th>
          <th>Categorie</th>
          <th style="width:130px;">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (m of listMatiere(); track $index) {
          <tr>
            <td><span class="config-id">#MAT-{{$index+1}}</span></td>
            <td><span class="config-intitule">{{m.intitule}}</span></td>
            <td><span class="config-desc">{{m.categorieMatiere.intitule}}</span></td>
            <td><div class="config-actions"><button class="btn btn-ghost btn-sm btn-icon" data-edit-row><i class="fas fa-pen"></i></button><button class="btn btn-danger btn-sm btn-icon" data-confirm-delete="Supprimer cette matière ?"><i class="fas fa-trash"></i></button></div></td>
          </tr>
        }
       
      </tbody>
    </table>
  </div>

        <!-- MODAL ADD MATIÈRE -->
<div class="modal-overlay" id="modal-add-matiere">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title"><i class="fas fa-book" style="color:var(--primary);margin-right:8px;"></i>Nouvelle matière</span>
      <button class="modal-close" onclick="closeModal('modal-add-matiere')"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <form class="admin-form" [formGroup]="matiereFb" id="form-matiere">
        <div class="form-group">
          <label class="form-label">Intitulé <span style="color:var(--red);">*</span></label>
          <input type="text" class="form-input" formControlName="intitule" placeholder="Ex : Mathématiques, Français…" required />
        </div>
        <div class="form-group">
          <label class="form-label">Categorie Matiere</label>
          <select class="form-select" formControlName="categorieMatiere">
            <option value="">--Choisir la section--</option>
            @for (s of listCategorieMatiere(); track $index) {
              <option value="{{s.id}}">{{s.intitule}}</option>
            }
          </select>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-add-matiere')">Annuler</button>
      <button class="btn btn-primary" (click)="createMatiere()">
        <i class="fas fa-save"></i> Enregistrer
      </button>
    </div>
  </div>
</div>
