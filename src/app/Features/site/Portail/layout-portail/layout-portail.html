<div class="lp-shell" [class.sidebar-collapsed]="sidebarCollapsed()">

  <!-- ══ SIDEBAR ══ -->
  <aside class="lp-sidebar" [class.open]="sidebarOpen()">
    <div class="lp-sidebar-inner">

      <!-- Logo -->
      <div class="lp-logo">
        <div class="lp-logo-mark">E</div>
        <span class="lp-logo-text">EDUCIA</span>
      </div>

      <!-- Nav links -->
      <nav class="lp-nav" role="navigation">
        <button
          class="lp-nav-item"
          type="button"
        >
          <span class="lp-nav-icon">⊞</span>
          <span class="lp-nav-label">Dashboard</span>
        </button>

        <button
          class="lp-nav-item"
          routerLink="offre"
          routerLinkActive="active"
          type="button"
        >
          <span class="lp-nav-icon">📋</span>
          <span class="lp-nav-label">Mes offres</span>
          @if (offreBadge() > 0) {
            <span class="lp-nav-badge">{{ offreBadge() }}</span>
          }
        </button>

        <button
          class="lp-nav-item"
          [class.active]="activeSection() === 'candidatures'"
          (click)="setSection('candidatures')"
          type="button"
        >
          <span class="lp-nav-icon">🎯</span>
          <span class="lp-nav-label">Candidatures</span>
          @if (candidatureBadge() > 0) {
            <span class="lp-nav-badge accent">{{ candidatureBadge() }}</span>
          }
        </button>
      </nav>

      <!-- Spacer -->
      <div style="flex:1;"></div>

      <!-- Footer sidebar -->
      <div class="lp-sidebar-foot">
        <div class="lp-user-chip">
          <div class="lp-user-avatar">P</div>
          <div class="lp-user-info">
            <div class="lp-user-name">Parent</div>
            <div class="lp-user-role">Mon espace</div>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Overlay mobile -->
  <div
    class="lp-overlay"
    [class.show]="sidebarOpen()"
    (click)="closeSidebar()"
  ></div>

  <!-- ══ MAIN AREA ══ -->
  <div class="lp-main">

    <!-- ── Navbar ── -->
    <header class="lp-navbar">
      <button class="lp-hamburger" type="button" (click)="toggleSidebar()" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>

      <div class="lp-navbar-title">
        @switch (activeSection()) {
          @case ('dashboard') { <span>Vue d'ensemble</span> }
          @case ('offres') { <span>Mes offres</span> }
          @case ('candidatures') { <span>Candidatures</span> }
        }
      </div>

      <div class="lp-navbar-actions">
        <button class="btn btn-sm btn-primary" type="button" (click)="nouvelleOffre()">
          ＋ Nouvelle offre
        </button>
      </div>
    </header>

    <!-- ── Contenu ── -->
    <main class="lp-content">
      <router-outlet></router-outlet>
    </main>

    <!-- ── Footer ── -->
    <footer class="lp-footer">
      <span>© 2025 EDUCIA — Plateforme éducative</span>
    </footer>

  </div><!-- /lp-main -->
</div><!-- /lp-shell -->
