<div class="docx-viewer-wrapper">

  <!-- Toolbar -->
  <div class="docx-toolbar">
    <div class="docx-toolbar-left">
      <span class="docx-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="#2b579a" stroke-width="2" stroke-linecap="round"/>
          <polyline points="14,2 14,8 20,8" stroke="#2b579a" stroke-width="2" stroke-linecap="round"/>
          <line x1="16" y1="13" x2="8" y2="13" stroke="#2b579a" stroke-width="2" stroke-linecap="round"/>
          <line x1="16" y1="17" x2="8" y2="17" stroke="#2b579a" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="docx-label">Aperçu Word</span>
    </div>
    <div class="docx-toolbar-right">
      <span class="docx-badge">Microsoft Office Viewer</span>
      <a class="docx-open-btn" [href]="fileUrl" target="_blank" rel="noopener" download>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <polyline points="7,10 12,15 17,10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Télécharger
      </a>
    </div>
  </div>

  <!-- Loading -->
  @if (isLoading && !hasError) {
    <div class="docx-loading">
      <div class="docx-spinner">
        <div class="docx-spinner-ring"></div>
        <div class="docx-spinner-icon">W</div>
      </div>
      <span>Chargement via Office Online…</span>
    </div>
  }

  <!-- Error -->
  @if (hasError) {
    <div class="docx-error">
      <div class="docx-error-icon">📄</div>
      <p>L'aperçu n'est pas disponible.</p>
      <p class="docx-error-hint">Le fichier doit être accessible publiquement pour l'aperçu Office Online.</p>
      <a [href]="fileUrl" target="_blank" class="docx-open-btn" rel="noopener" download>Télécharger le fichier</a>
    </div>
  }

  <!-- Office iframe -->
  @if (safeUrl && !hasError) {
    <iframe
      class="docx-frame"
      [src]="safeUrl"
      (load)="onLoad()"
      (error)="onError()"
      frameborder="0"
      allowfullscreen>
    </iframe>
  }

</div>
