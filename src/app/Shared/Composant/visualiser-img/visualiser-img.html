<div class="img-viewer-wrapper">

  <!-- Toolbar -->
  <div class="img-toolbar">
    <div class="img-toolbar-left">
      <span class="img-icon">🖼️</span>
      <span class="img-label">Aperçu Image</span>
    </div>
    <div class="img-toolbar-right">
      <button class="img-tool-btn" (click)="toggleZoom()" [class.active]="isZoomed" title="Zoom">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          @if (!isZoomed) {
            <line x1="11" y1="8" x2="11" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="8" y1="11" x2="14" y2="11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          } @else {
            <line x1="8" y1="11" x2="14" y2="11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          }
        </svg>
        {{ isZoomed ? 'Réduire' : 'Agrandir' }}
      </button>
      <a class="img-open-btn" [href]="fileUrl" target="_blank" rel="noopener" download>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <polyline points="7,10 12,15 17,10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Télécharger
      </a>
    </div>
  </div>

  <!-- Contenu -->
  <div class="img-content" [class.zoomed]="isZoomed">

    @if (isLoading && !hasError) {
      <div class="img-loading">
        <div class="img-loading-grid">
          <span></span><span></span><span></span><span></span>
        </div>
        <span>Chargement de l'image…</span>
      </div>
    }

    @if (hasError) {
      <div class="img-error">
        <div class="img-error-icon">🖼️</div>
        <p>Image introuvable ou inaccessible.</p>
        <a [href]="fileUrl" target="_blank" rel="noopener" class="img-open-btn">Ouvrir l'URL</a>
      </div>
    }

    @if (safeUrl && !hasError) {
      <img
        class="img-preview"
        [class.hidden]="isLoading"
        [class.zoomed-img]="isZoomed"
        [src]="safeUrl"
        alt="Aperçu du document"
        (load)="onLoad()"
        (error)="onError()"
        (click)="toggleZoom()"
      />
    }

  </div>

</div>
