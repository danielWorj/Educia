<div class="pdf-viewer-wrapper">

  <!-- Toolbar -->
  <div class="pdf-toolbar">
    <div class="pdf-toolbar-left">
      <span class="pdf-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <polyline points="14,2 14,8 20,8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="16" y1="13" x2="8" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="16" y1="17" x2="8" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <polyline points="10,9 9,9 8,9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="pdf-label">Aperçu PDF</span>
    </div>
    <a class="pdf-open-btn" [href]="fileUrl" target="_blank" rel="noopener">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <polyline points="15,3 21,3 21,9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="10" y1="14" x2="21" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Ouvrir
    </a>
  </div>

  <!-- Loading state -->
  @if (isLoading && !hasError) {
    <div class="pdf-loading">
      <div class="pdf-spinner"></div>
      <span>Chargement du document…</span>
    </div>
  }

  <!-- Error state -->
  @if (hasError) {
    <div class="pdf-error">
      <div class="pdf-error-icon">⚠️</div>
      <p>Impossible de charger l'aperçu.</p>
      <a [href]="fileUrl" target="_blank" class="pdf-open-btn" rel="noopener">Ouvrir directement</a>
    </div>
  }

  <!-- PDF iframe -->
  @if (safeUrl && !hasError) {
    <iframe
      class="pdf-frame"
      [src]="safeUrl"
      (load)="onLoad()"
      (error)="onError()"
      frameborder="0"
      allowfullscreen>
    </iframe>
  }

</div>
